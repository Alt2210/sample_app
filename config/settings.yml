available_locales:
  - en
  - ja
  - vi
links:
  tutorial_link: "http://www.railstutorial.org/"
  tutorial_book_link: "http://www.railstutorial.org/book"
  gravatar_link: "https://secure.gravatar.com/avatar/"
  gravatar_email: "http://gravatar.com/emails"
